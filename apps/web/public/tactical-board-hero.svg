<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="850" viewBox="0 0 1160 850" fill="none">
  <title>Una pizarra táctica con una formación 4–3–3</title>
  <desc>Ilustración original de una cancha, jugadores numerados y una diagonal de ataque dibujada en ámbar.</desc>
  <defs>
    <pattern id="grain" width="5" height="5" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".45" fill="#B8D0BA" fill-opacity=".12" />
    </pattern>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#E8A453" />
    </marker>
    <marker id="arrow-chalk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#E5EBDD" />
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#07140F" flood-opacity=".34" />
    </filter>
  </defs>

  <g filter="url(#shadow)" transform="rotate(-2 580 425)">
    <rect x="44" y="38" width="1072" height="774" rx="22" fill="#19362C" stroke="#597360" stroke-opacity=".5" />
    <rect x="65" y="58" width="1030" height="734" rx="15" fill="#214A38" />
    <rect x="65" y="58" width="1030" height="734" rx="15" fill="url(#grain)" />
    <path d="M80 246H1080M80 614H1080" stroke="#FFFFFF" stroke-opacity=".035" stroke-width="112" />

    <g stroke="#DFE9D9" stroke-opacity=".6" stroke-width="2.2">
      <rect x="91" y="82" width="978" height="686" rx="2" />
      <path d="M580 82V768" />
      <circle cx="580" cy="425" r="100" />
      <path d="M91 264H220V586H91M91 336H135V514H91M1069 264H940V586H1069M1069 336H1025V514H1069" />
      <path d="M91 378H104M91 472H104M1056 378H1069M1056 472H1069" />
    </g>
    <g fill="#E7EEE0" fill-opacity=".7">
      <circle cx="580" cy="425" r="4" />
      <circle cx="178" cy="425" r="4" />
      <circle cx="982" cy="425" r="4" />
    </g>

    <path d="M290 462C402 468 470 435 554 420C642 404 713 356 830 319" stroke="#E8A453" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 12" marker-end="url(#arrow-amber)" />
    <path d="M440 240C500 280 530 330 570 395" stroke="#DCE7D8" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 10" marker-end="url(#arrow-chalk)" opacity=".72" />
    <path d="M690 574C738 536 784 492 814 428" stroke="#DCE7D8" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 10" marker-end="url(#arrow-chalk)" opacity=".58" />

    <g fill="#E7EEE0" stroke="#F8F7EC" stroke-width="3">
      <circle cx="174" cy="425" r="20" /><circle cx="320" cy="250" r="20" />
      <circle cx="330" cy="365" r="20" /><circle cx="330" cy="484" r="20" />
      <circle cx="320" cy="600" r="20" /><circle cx="492" cy="316" r="20" />
      <circle cx="510" cy="425" r="20" /><circle cx="492" cy="534" r="20" />
      <circle cx="686" cy="270" r="20" /><circle cx="714" cy="425" r="20" />
      <circle cx="686" cy="580" r="20" />
    </g>
    <g fill="#19362C" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="central">
      <text x="174" y="425">1</text><text x="320" y="250">2</text><text x="330" y="365">4</text>
      <text x="330" y="484">5</text><text x="320" y="600">3</text><text x="492" y="316">6</text>
      <text x="510" y="425">8</text><text x="492" y="534">10</text><text x="686" y="270">7</text>
      <text x="714" y="425">9</text><text x="686" y="580">11</text>
    </g>
    <circle cx="714" cy="425" r="28" stroke="#E8A453" stroke-opacity=".8" stroke-width="2" />

    <g>
      <rect x="117" y="104" width="144" height="38" rx="19" fill="#142B23" fill-opacity=".88" stroke="#FFFFFF" stroke-opacity=".15" />
      <circle cx="137" cy="123" r="4" fill="#E8A453" />
      <text x="150" y="128" fill="#ECF0E6" font-family="Arial, sans-serif" font-size="14" letter-spacing=".4">4—3—3</text>
      <rect x="796" y="682" width="228" height="49" rx="9" fill="#142B23" fill-opacity=".88" stroke="#FFFFFF" stroke-opacity=".14" />
      <path d="M814 706H839" stroke="#E8A453" stroke-width="3" stroke-dasharray="5 5" marker-end="url(#arrow-amber)" />
      <text x="851" y="711" fill="#E9EDE2" font-family="Arial, sans-serif" font-size="13">Desmarque diagonal</text>
    </g>
  </g>
</svg>
